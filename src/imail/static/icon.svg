<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="imail">
  <title>imail</title>
  <defs>
    <linearGradient id="imail-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="imail-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1E3A8A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Rounded tile, azure→indigo gradient. -->
  <rect width="64" height="64" rx="14" fill="url(#imail-bg)"/>
  <!-- Envelope: bolder + slightly wider than v1 for more presence. -->
  <g filter="url(#imail-shadow)">
    <rect x="11" y="22" width="42" height="28" rx="3.5"
          fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <path d="M11.5 25.5 L32 40 L52.5 25.5"
          fill="none" stroke="#ffffff" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Bright amber notification dot in the upper-right — reads as the i's
       dot AND as "you have mail". White rim makes it pop on dark
       backgrounds (dock, favicon at 16px). -->
  <circle cx="49" cy="17" r="7" fill="#ffffff"/>
  <circle cx="49" cy="17" r="5.2" fill="#FBBF24"/>
</svg>
