[project]
name = "mail-triage"
version = "0.1.0"
description = "Triage your inbox in seconds: 3 LLM-generated reply versions per email, pick one with a single keypress."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jie Xu" }]
keywords = ["email", "gmail", "llm", "anthropic", "claude", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
]
dependencies = [
  "anthropic>=0.39.0",
  "google-api-python-client>=2.150.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.1",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "typer>=0.15.0",
]

[project.scripts]
mail-triage = "mail_triage.cli:app"

[project.urls]
Repository = "https://github.com/wzh4464/mail-triage"
Issues = "https://github.com/wzh4464/mail-triage/issues"

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "types-requests>=2.32.0.20240914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_triage"]

# ============================================================
# Ruff — linter + formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "N",        # pep8-naming
  "C4",       # comprehensions
  "PIE",      # misc
  "PT",       # pytest style
  "RET",      # return
  "TID",      # tidy imports
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# Mypy — static typing
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true   # Google API libs lack stubs

# google-* libraries don't ship type stubs, so we cannot type-check their calls.
[[tool.mypy.overrides]]
module = ["google.*", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_errors = true
follow_imports = "skip"

# Suppress untyped-call complaints on calls into these unstubbed libs.
[[tool.mypy.overrides]]
module = "mail_triage.gmail_client"
disallow_untyped_calls = false

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
