[project]
name = "mail-triage"
version = "0.2.0"
description = "Inbox triage as a local app: log in to Gmail / Outlook / 163 and clear emails with 3-version LLM-drafted replies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jie Xu" }]
keywords = ["email", "gmail", "outlook", "imap", "llm", "anthropic", "claude", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Email",
]
dependencies = [
  "anthropic>=0.39.0",
  "fastapi>=0.115.0",
  "google-api-python-client>=2.150.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.1",
  "keyring>=25.5.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
mail-triage = "mail_triage.cli:main"

[project.urls]
Repository = "https://github.com/jessecu2024/mail-triage"
Issues = "https://github.com/jessecu2024/mail-triage/issues"

[dependency-groups]
dev = [
  "httpx>=0.27.0",            # FastAPI TestClient dep
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_triage"]

[tool.hatch.build.targets.wheel.force-include]
"src/mail_triage/static" = "mail_triage/static"

# ============================================================
# Ruff — linter + formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "RUF",      # ruff-specific
  "N",        # pep8-naming
  "C4",       # comprehensions
  "PIE",      # misc
  "PT",       # pytest style
  "RET",      # return
  "TID",      # tidy imports
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# Mypy — static typing
# ============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true   # 3rd-party libs without stubs

# google-* + keyring lack type stubs; let those module calls through.
[[tool.mypy.overrides]]
module = ["google.*", "googleapiclient.*", "google_auth_oauthlib.*"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["mail_triage.providers.gmail", "mail_triage.providers.imap", "mail_triage.accounts"]
disallow_untyped_calls = false

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
